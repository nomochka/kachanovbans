# Основной конфиг плагина KachanovBans
timezone: Europe/Moscow

# Режим отладки (вывод подробной информации в консоль)
debug: false

# Тип хранилища
storage-type: mysql

# Отдельная MySQL-база KachBans для банов, мутов и истории
mysql:
  host: mariadb
  port: 3306
  database: vanilla_test
  user: vanilla_test
  password: ""
  connect-timeout-seconds: 3

check-interval: 1200
pagination:
  items-per-page: 10
  button-next: <green>[→]</green>
  button-prev: <green>[←]</green>
  button-close: <red>[✕]</red>
silent-enabled: true

privacy:
  hide-ip-in-messages: true

# Защита сотрудников. Ключи должны быть уникальными и не короче 8 символов.
security:
  enabled: true
  session-minutes: 480
  same-ip-rejoin-minutes: 60
  stage-timeout-seconds: 60
  # Названия групп LuckPerms (проверяются как permission group.<группа>).
  staff-groups:
  - help
  - helper
  - admin
  - super_admin
  - moderator
  - mod
  - moder
  require-discord-link: true
  require-discord-2fa: false
  require-access-key: false
  # Привязка
  discord-link-database:
    enabled: true
    host: 127.0.0.1
    port: 3306
    database: velocity
    user: velocity
    password: ""
    table: granted_passes
    player-column: player
    discord-id-column: discord_id
    connect-timeout-seconds: 3
    cache-seconds: 15
  access-keys:
    AdminNick: CHANGE-ME-ADMIN
    ModeratorNick: CHANGE-ME-MODERATOR
  # Ключи по группам LuckPerms. Персональный ключ выше имеет приоритет.
  group-access-keys:
    help: CHANGE-ME
    helper: CHANGE-ME
    moderator: CHANGE-ME
    mod: CHANGE-ME
    moder: CHANGE-ME
    admin: CHANGE-ME
    super_admin: CHANGE-ME
  staff-permission: kachanovbans.staff

bots:
  superowner-discord-id: "PUT-SUPEROWNER-DISCORD-ID"
  allowed-discord-ids:
  - "PUT-SUPEROWNER-DISCORD-ID"
  superowner-telegram-id: "PUT-SUPEROWNER-TELEGRAM-ID"
  discord:
    enabled: true
    token: "PUT-YOUR-DISCORD-BOT-TOKEN-HERE"
    guild-id: ''
    senior-channel-id: ''
    punishment-channel-id: ''
    audit-channel-id: ''
  telegram:
    enabled: true
    token: "PUT-YOUR-TELEGRAM-BOT-TOKEN-HERE"
    senior-chat-id: ''
    punishment-chat-id: ''
    punishment-thread-id: 0
    audit-chat-id: ''
    audit-thread-id: 0

evidence:
  enabled: true
  timeout-minutes: 60

# Совместимые настройки доступа Telegram.
telegramSuperOwnerId: "PUT-SUPEROWNER-TELEGRAM-ID"
telegramAdminChatIds:
- "PUT-TELEGRAM-ADMIN-CHAT-ID"
telegramBootstrapChatTitle: ''
telegramNotificationChatIds:
- "PUT-TELEGRAM-ADMIN-CHAT-ID"
telegramAllowRawCommands: true
telegramRawCommandUsernames:
- your_telegram_username
# Только неизменяемые цифровые ID. Username не используется для авторизации.
telegramAllowedUserIds: []
warnings:
  enabled: true
  categories:
    autofarm:
      display-name: Автоферма
      expire-days: 30
      steps:
        '1':
          action: tempban
          duration: 1d
        '2':
          action: tempban
          duration: 3d
        '3':
          action: tempban
          duration: 14d
        '4':
          action: ban
    family-insult:
      display-name: Оскорбление родных
      expire-days: 30
      steps:
        '1':
          action: tempmute
          duration: 1d
        '2':
          action: tempban
          duration: 1d
        '3':
          action: tempban
          duration: 3d
legacy-auth:
  enabled: false
confirmations:
  timeout-seconds: 120
command-audit:
  enabled: true
  commands:
  - gm
  - gamemode
  - gmc
  - gms
  - gma
  - gmsp
  - co
  - coreprotect
  - tp
  - teleport
  - tphere
  - tpall
  - eco
  - economy
  - give
  - clear
  - op
  - deop
  - lp
  - luckperms
  - pex
  - permissions
  - whitelist
  - stop
  - restart
  - reload
  - rl
  - execute
  - sudo
  - kill
  - summon
  - setblock
  - fill
  - worldedit
  - we
voice-mute-audit:
  enabled: true
  mute-commands:
  - pvmute
  - vmute
  unmute-commands:
  - pvunmute
  - vunmute
blacknick:
  enabled: true
  hearts: 4
  broadcast: true
  color-name-above-head: false
  actionbar: true
  progress-save-every: 25
  drop-whitelist:
  - DIRT
  - GRASS_BLOCK
  - COARSE_DIRT
  - ROOTED_DIRT
  - STONE
  - COBBLESTONE
  allowed-commands:
  - msg
  - m
  - tell
  - w
  - r
  - reply
  - search
  - donate
  tasks:
    obsidian:
      display-name: Скопать 15000 обсидиана
      type: break
      materials:
      - OBSIDIAN
      - CRYING_OBSIDIAN
      amount: 15000
    stone:
      display-name: Скопать 1000000 камня
      type: break
      materials:
      - STONE
      - DEEPSLATE
      amount: 1000000
    maiki:
      display-name: Сломать 25 Маяков
      type: break
      materials:
      - BEACON
      amount: 25
    fish:
      display-name: Выловить 30000 рыбы
      type: fish
      amount: 30000
    zombies:
      display-name: Убить 9000 зомби
      type: kill
      entities:
      - ZOMBIE
      - HUSK
      - DROWNED
      amount: 9000
    pigs:
      display-name: Убить 70000 свиней
      type: kill
      entities:
      - PIG
      amount: 70000
